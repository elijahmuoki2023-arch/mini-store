<!DOCTYPE html>
<html>

<head>
    <title>Admin Orders - Mini Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <script>

        const adminToken =
            localStorage.getItem("adminToken");

        if (!adminToken) {

            window.location.href =
                "admin-login.html";
        }

    </script>


    <nav>

        <div class="logo">
            Mini Store Admin
        </div>

        <div class="nav-links">

            <a href="index.html">Store</a>

            <a href="products.html">Products</a>

            <a href="admin-orders.html">Orders</a>

        </div>

    </nav>


    <section class="admin-section">

        <div class="admin-header">

            <div>

                <h1>
                    Orders Dashboard
                </h1>

                <p>
                    Manage and monitor customer orders.
                </p>

            </div>

            <button onclick="loadOrders()">
                Refresh Orders
            </button>

        </div>


        <div class="admin-stats">

            <div class="stat-card">

                <span>
                    Total Orders
                </span>

                <strong id="total-orders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Pending
                </span>

                <strong id="pending-orders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Processing
                </span>

                <strong id="processing-orders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Delivered
                </span>

                <strong id="delivered-orders">
                    0
                </strong>

            </div>

        </div>


        <div id="orders-container">

            <p class="loading-orders">
                Loading orders...
            </p>

        </div>

    </section>


    <script src="js/app.js"></script>

</body>

</html>
