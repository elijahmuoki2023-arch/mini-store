<!DOCTYPE html>
<html>

<head>
    <title>Checkout - Mini Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <div class="logo">Mini Store</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </div>
    </nav>

    <section class="cart-section">

        <h1>Checkout</h1>

        <!-- ORDER SUMMARY -->

        <div id="checkout-summary">

            <h2>Order Summary</h2>

            <div id="checkout-items">
                <p>Loading order...</p>
            </div>

            <h2 id="checkout-total">
                Total: Ksh 0
            </h2>

        </div>


        <!-- CUSTOMER DETAILS -->

        <h2>Customer Details</h2>

        <form id="checkout-form">

            <input
                type="text"
                id="customer-name"
                placeholder="Full Name"
                required
            >

            <br><br>

            <input
                type="email"
                id="customer-email"
                placeholder="Email Address"
                required
            >

            <br><br>

            <input
                type="text"
                id="customer-phone"
                placeholder="Phone Number"
                required
            >

            <br><br>

            <textarea
                id="customer-address"
                placeholder="Delivery Address"
                required
            ></textarea>

            <br><br>

            <button type="submit">
                Place Order
            </button>

        </form>

        <p id="checkout-message"></p>

    </section>

    <script src="js/app.js"></script>

</body>

</html>
