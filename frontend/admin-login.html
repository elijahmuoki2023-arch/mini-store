<!DOCTYPE html>
<html>

<head>

    <title>Admin Login - Mini Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <nav>

        <div class="logo">
            Mini Store
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

        </div>

    </nav>


    <section class="admin-login-section">

        <div class="admin-login-card">

            <h1>
                Admin Login
            </h1>

            <p>
                Sign in to manage Mini Store
            </p>


            <form id="admin-login-form">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="admin-username"
                    placeholder="Enter username"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="admin-login-message"></p>

        </div>

    </section>


    <script src="js/app.js"></script>

</body>

</html>
